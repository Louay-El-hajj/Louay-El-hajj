name: Metrics

# Needs a repo secret named METRICS_TOKEN: a classic personal access token
# with the `public_repo` and `read:user` scopes.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Overview (isometric calendar, languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          committer_message: "chore(metrics): update overview [skip ci]"
          config_timezone: Asia/Beirut
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

      - name: Featured projects
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/projects.svg
          committer_message: "chore(metrics): update projects [skip ci]"
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: estests-qa-automation, Sentinel, hackathon-repo, Expense-Tracker
          plugin_repositories_pinned: 0
